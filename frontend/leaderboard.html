<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard | EDUTECH NEXUS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/nexus-core.css">
  <style>
    .leaderboard-container {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 30px;
      backdrop-filter: blur(16px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }
    .leaderboard-category-nav {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 16px;
      flex-wrap: wrap;
    }
    .cat-btn {
      padding: 10px 22px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      background: rgba(15, 23, 42, 0.6);
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
      font-family: inherit;
    }
    .cat-btn:hover {
      background: rgba(99, 102, 241, 0.15);
      color: #fff;
      border-color: rgba(99, 102, 241, 0.4);
    }
    .cat-btn.active {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      border-color: #a855f7;
      box-shadow: 0 4px 18px rgba(99, 102, 241, 0.4);
    }
    .leaderboard-controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 14px;
    }
    .view-toggle-btns {
      display: flex;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 4px;
    }
    .toggle-tab-btn {
      padding: 8px 18px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .toggle-tab-btn.active {
      background: #6366f1;
      color: #fff;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
    }
    .podium-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 30px;
      align-items: flex-end;
    }
    @media (max-width: 768px) {
      .podium-grid {
        grid-template-columns: 1fr;
      }
    }
    .podium-card {
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.8));
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      position: relative;
      transition: all 0.3s ease;
    }
    .podium-card:hover {
      transform: translateY(-4px);
    }
    .podium-card.rank-1 {
      border-color: #fbbf24;
      background: linear-gradient(145deg, rgba(251, 191, 36, 0.12), rgba(15, 23, 42, 0.9));
      box-shadow: 0 0 25px rgba(251, 191, 36, 0.25);
    }
    .podium-card.rank-2 {
      border-color: #94a3b8;
      background: linear-gradient(145deg, rgba(148, 163, 184, 0.12), rgba(15, 23, 42, 0.9));
    }
    .podium-card.rank-3 {
      border-color: #f59e0b;
      background: linear-gradient(145deg, rgba(217, 119, 6, 0.12), rgba(15, 23, 42, 0.9));
    }
    .podium-badge-icon {
      font-size: 32px;
      margin-bottom: 8px;
      display: block;
    }
    .podium-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      margin: 0 auto 12px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      object-fit: cover;
      display: block;
    }
    .podium-card.rank-1 .podium-avatar { border-color: #fbbf24; }
    .podium-card.rank-2 .podium-avatar { border-color: #94a3b8; }
    .podium-card.rank-3 .podium-avatar { border-color: #f59e0b; }
    .student-cell {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .student-avatar-img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      background: #0f172a;
      border: 2px solid var(--border-medium);
      flex-shrink: 0;
    }
    .rank-number-box {
      font-weight: 800;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 8px;
    }
    .rank-1 { background: rgba(251, 191, 36, 0.2); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.4); }
    .rank-2 { background: rgba(148, 163, 184, 0.2); color: #e2e8f0; border: 1px solid rgba(148, 163, 184, 0.4); }
    .rank-3 { background: rgba(217, 119, 6, 0.2); color: #f59e0b; border: 1px solid rgba(217, 119, 6, 0.4); }
    .rank-other { color: var(--text-secondary); background: rgba(255, 255, 255, 0.04); }
  </style>
</head>
<body>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nexus-student.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const layout = await renderStudentLayout(
        'leaderboard.html',
        'Official Student Leaderboard',
        'Real-time student rankings across XP achievements, courses, quizzes, and technical games. Updated continuously from MongoDB.'
      );
      if (!layout) return;

      const { pageContent, headerActions } = layout;

      headerActions.innerHTML = `
        <span class="live-indicator"><span class="live-dot"></span> Live Sync (15s)</span>
        <a href="courses.html" class="btn-nexus btn-nexus-secondary" style="font-size:13px;">
          <i class="fa-solid fa-graduation-cap"></i> Earn XP in Courses
        </a>
        <a href="games.html" class="btn-nexus btn-nexus-primary" style="font-size:13px;">
          <i class="fa-solid fa-gamepad"></i> Play Games
        </a>
      `;

      pageContent.innerHTML = `
        <div class="leaderboard-container">
          <!-- Top Category Tabs -->
          <div class="leaderboard-category-nav">
            <button type="button" class="cat-btn active" id="cat-global-xp">
              <i class="fa-solid fa-trophy" style="color:#fbbf24;"></i> Overall Student XP Rankings
            </button>
            <button type="button" class="cat-btn" id="cat-games">
              <i class="fa-solid fa-gamepad" style="color:#38bdf8;"></i> Technical Games Leaderboard
            </button>
          </div>

          <!-- Podium Area (Shown for Global XP) -->
          <div id="podium-area" class="podium-grid"></div>

          <!-- Controls: View Toggle (Top 10 vs All) & Filters -->
          <div class="leaderboard-controls-row">
            <div class="view-toggle-btns">
              <button type="button" class="toggle-tab-btn active" id="tab-top10">
                <i class="fa-solid fa-ranking-star"></i> Top 10 Performers
              </button>
              <button type="button" class="toggle-tab-btn" id="tab-all">
                <i class="fa-solid fa-users"></i> View All Participants
              </button>
            </div>

            <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
              <div id="game-filter-wrapper" style="display:none;">
                <select id="game-filter-select" class="nexus-select" style="min-width:190px;">
                  <option value="all">All Technical Games</option>
                  <option value="Debugging Challenge">Debugging Challenge</option>
                  <option value="Technical Quiz">Technical Quiz</option>
                  <option value="Logic & Coding Challenge">Logic & Coding Challenge</option>
                </select>
              </div>

              <div class="search-input-wrapper" style="min-width:240px;">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="leaderboard-search" class="nexus-input" placeholder="Search by student name or dept...">
              </div>
            </div>
          </div>

          <!-- Table of Rankings -->
          <div class="table-responsive">
            <table class="nexus-table">
              <thead id="leaderboard-thead">
                <!-- Injected dynamically based on category -->
              </thead>
              <tbody id="leaderboard-tbody">
                <tr>
                  <td colspan="7" style="text-align:center;padding:40px;">
                    <div class="state-spinner" style="margin:0 auto 12px;"></div>
                    Loading Leaderboard Rankings from Database...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      `;

      let currentCategory = 'global-xp'; // 'global-xp' or 'games'
      let currentView = 'top10'; // 'top10' or 'all'
      let currentGameFilter = 'all';
      let cachedData = [];

      async function fetchLeaderboard() {
        const tbody = document.getElementById('leaderboard-tbody');
        const thead = document.getElementById('leaderboard-thead');
        const podiumArea = document.getElementById('podium-area');
        const gameFilterWrapper = document.getElementById('game-filter-wrapper');

        if (!tbody || !thead) return;

        if (currentCategory === 'global-xp') {
          gameFilterWrapper.style.display = 'none';
          thead.innerHTML = `
            <tr>
              <th style="width:80px;">Rank</th>
              <th>Student Name</th>
              <th>Department</th>
              <th>Institution / College</th>
              <th style="text-align:center;">Level</th>
              <th style="text-align:center;">Achievement Tier</th>
              <th style="text-align:right;">Total XP</th>
            </tr>
          `;

          try {
            const limit = currentView === 'all' ? 100 : 10;
            const res = await api.get(`/leaderboard?limit=${limit}`);
            cachedData = res.leaderboard || [];

            // Render Podium for Top 3
            if (cachedData.length >= 3 && podiumArea) {
              const r1 = cachedData[0];
              const r2 = cachedData[1];
              const r3 = cachedData[2];

              podiumArea.style.display = 'grid';
              podiumArea.innerHTML = `
                <!-- Rank 2 -->
                <div class="podium-card rank-2">
                  <span class="podium-badge-icon">🥈</span>
                  <img src="${r2.profileImage}" class="podium-avatar" alt="${r2.fullName}">
                  <strong style="font-size:16px;color:#fff;display:block;">${r2.fullName}</strong>
                  <div style="font-size:12px;color:var(--text-secondary);margin:4px 0;">${r2.department}</div>
                  <div style="color:#e2e8f0;font-weight:800;font-size:15px;"><i class="fa-solid fa-bolt" style="color:#fbbf24;"></i> ${r2.xp} XP</div>
                  <span class="nexus-badge badge-blue" style="margin-top:6px;font-size:10px;">Rank 2 · Level ${r2.level || 1}</span>
                </div>

                <!-- Rank 1 (Center) -->
                <div class="podium-card rank-1" style="transform:translateY(-8px);">
                  <span class="podium-badge-icon">🥇</span>
                  <img src="${r1.profileImage}" class="podium-avatar" alt="${r1.fullName}">
                  <strong style="font-size:18px;color:#fff;display:block;">${r1.fullName}</strong>
                  <div style="font-size:12px;color:#fbbf24;margin:4px 0;">${r1.department}</div>
                  <div style="color:#fbbf24;font-weight:800;font-size:18px;"><i class="fa-solid fa-bolt"></i> ${r1.xp} XP</div>
                  <span class="nexus-badge badge-purple" style="margin-top:6px;font-size:11px;">🏆 Champion · Level ${r1.level || 1}</span>
                </div>

                <!-- Rank 3 -->
                <div class="podium-card rank-3">
                  <span class="podium-badge-icon">🥉</span>
                  <img src="${r3.profileImage}" class="podium-avatar" alt="${r3.fullName}">
                  <strong style="font-size:16px;color:#fff;display:block;">${r3.fullName}</strong>
                  <div style="font-size:12px;color:var(--text-secondary);margin:4px 0;">${r3.department}</div>
                  <div style="color:#f59e0b;font-weight:800;font-size:15px;"><i class="fa-solid fa-bolt"></i> ${r3.xp} XP</div>
                  <span class="nexus-badge badge-orange" style="margin-top:6px;font-size:10px;">Rank 3 · Level ${r3.level || 1}</span>
                </div>
              `;
            } else if (podiumArea) {
              podiumArea.style.display = 'none';
            }

            renderGlobalXPTable();
          } catch (err) {
            tbody.innerHTML = `
              <tr>
                <td colspan="7" style="text-align:center;color:#ef4444;padding:30px;">
                  <i class="fa-solid fa-triangle-exclamation"></i> Error loading student leaderboard: ${err.message}
                </td>
              </tr>
            `;
          }

        } else {
          // Games Category
          if (podiumArea) podiumArea.style.display = 'none';
          gameFilterWrapper.style.display = 'block';

          thead.innerHTML = `
            <tr>
              <th style="width:80px;">Rank</th>
              <th>Student Name</th>
              <th>Department</th>
              <th>Game Challenge</th>
              <th style="text-align:center;">Score</th>
              <th style="text-align:center;">Correct Answers</th>
              <th style="text-align:right;">Completed Date</th>
            </tr>
          `;

          try {
            const isAll = currentView === 'all';
            const queryParams = new URLSearchParams({
              all: isAll ? 'true' : 'false',
              limit: isAll ? '100' : '10',
              game: currentGameFilter
            });

            const res = await api.get(`/games/leaderboard?${queryParams.toString()}`);
            cachedData = res.leaderboard || [];
            renderGamesTable();
          } catch (err) {
            tbody.innerHTML = `
              <tr>
                <td colspan="7" style="text-align:center;color:#ef4444;padding:30px;">
                  <i class="fa-solid fa-triangle-exclamation"></i> Error loading games leaderboard: ${err.message}
                </td>
              </tr>
            `;
          }
        }
      }

      function renderGlobalXPTable() {
        const tbody = document.getElementById('leaderboard-tbody');
        if (!tbody) return;

        const search = (document.getElementById('leaderboard-search')?.value || '').toLowerCase().trim();
        const filtered = cachedData.filter(u => {
          if (!search) return true;
          return (u.fullName || '').toLowerCase().includes(search) || (u.department || '').toLowerCase().includes(search) || (u.college || '').toLowerCase().includes(search);
        });

        if (!filtered.length) {
          tbody.innerHTML = `
            <tr>
              <td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted);">
                <i class="fa-solid fa-trophy" style="font-size:32px;margin-bottom:10px;display:block;opacity:0.4;"></i>
                No students match your query. Complete lessons or quizzes to climb the leaderboard!
              </td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = filtered.map((item, index) => {
          const rank = item.rank || (index + 1);
          let rankClass = 'rank-other';
          let rankBadge = `#${rank}`;

          if (rank === 1) { rankClass = 'rank-1'; rankBadge = '🥇 1'; }
          else if (rank === 2) { rankClass = 'rank-2'; rankBadge = '🥈 2'; }
          else if (rank === 3) { rankClass = 'rank-3'; rankBadge = '🥉 3'; }

          const avatar = item.profileImage || `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(item.fullName)}`;
          const isCurrentStudent = item.fullName === layout.currentUser?.fullName || item.email === layout.currentUser?.email;

          let badgeColor = 'badge-blue';
          if (item.badge === 'Master') badgeColor = 'badge-purple';
          else if (item.badge === 'Expert') badgeColor = 'badge-green';
          else if (item.badge === 'Achiever') badgeColor = 'badge-blue';
          else badgeColor = 'badge-cyan';

          return `
            <tr style="${isCurrentStudent ? 'background:rgba(99,102,241,0.14);border-left:3px solid #6366f1;' : ''}">
              <td>
                <span class="rank-number-box ${rankClass}">${rankBadge}</span>
              </td>
              <td>
                <div class="student-cell">
                  <img src="${avatar}" alt="${item.fullName}" class="student-avatar-img" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=EN'">
                  <div>
                    <strong style="color:#fff;display:block;">${item.fullName}</strong>
                    ${isCurrentStudent ? '<span class="nexus-badge badge-purple" style="font-size:10px;padding:1px 6px;">You</span>' : `<span style="font-size:11px;color:var(--text-secondary);">@${item.username || 'student'}</span>`}
                  </div>
                </div>
              </td>
              <td>
                <span style="color:#cbd5e1;">${item.department || 'Technology'}</span>
              </td>
              <td>
                <span style="color:var(--text-secondary);font-size:13px;">${item.college || 'Academic Partner'}</span>
              </td>
              <td style="text-align:center;">
                <span class="nexus-badge badge-blue">Lvl ${item.level || 1}</span>
              </td>
              <td style="text-align:center;">
                <span class="nexus-badge ${badgeColor}">${item.badge || 'Starter'}</span>
              </td>
              <td style="text-align:right;">
                <strong style="color:#fbbf24;font-size:16px;"><i class="fa-solid fa-bolt"></i> ${item.xp || 0} XP</strong>
              </td>
            </tr>
          `;
        }).join('');
      }

      function renderGamesTable() {
        const tbody = document.getElementById('leaderboard-tbody');
        if (!tbody) return;

        const search = (document.getElementById('leaderboard-search')?.value || '').toLowerCase().trim();
        const filtered = cachedData.filter(item => {
          if (!search) return true;
          return (item.studentName || '').toLowerCase().includes(search) || (item.department || '').toLowerCase().includes(search) || (item.gameName || '').toLowerCase().includes(search);
        });

        if (!filtered.length) {
          tbody.innerHTML = `
            <tr>
              <td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted);">
                <i class="fa-solid fa-gamepad" style="font-size:32px;margin-bottom:10px;display:block;opacity:0.4;"></i>
                No verified game scores recorded yet for this filter. Play a game to claim Rank 1!
              </td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = filtered.map((item, index) => {
          const rank = item.rank || (index + 1);
          let rankClass = 'rank-other';
          let rankBadge = `#${rank}`;

          if (rank === 1) { rankClass = 'rank-1'; rankBadge = '🥇 1'; }
          else if (rank === 2) { rankClass = 'rank-2'; rankBadge = '🥈 2'; }
          else if (rank === 3) { rankClass = 'rank-3'; rankBadge = '🥉 3'; }

          const avatar = item.profileImage || `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(item.studentName)}`;
          const dateStr = item.completionDate 
            ? new Date(item.completionDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
            : 'Recent';

          const isCurrentStudent = item.studentName === layout.currentUser?.fullName;

          return `
            <tr style="${isCurrentStudent ? 'background:rgba(99,102,241,0.12);' : ''}">
              <td>
                <span class="rank-number-box ${rankClass}">${rankBadge}</span>
              </td>
              <td>
                <div class="student-cell">
                  <img src="${avatar}" alt="${item.studentName}" class="student-avatar-img" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=EN'">
                  <div>
                    <strong style="color:#fff;display:block;">${item.studentName}</strong>
                    ${isCurrentStudent ? '<span class="nexus-badge badge-purple" style="font-size:10px;padding:1px 6px;">You</span>' : ''}
                  </div>
                </div>
              </td>
              <td>
                <span style="color:#cbd5e1;">${item.department || 'Technology'}</span>
              </td>
              <td>
                <span class="nexus-badge badge-blue">${item.gameName}</span>
              </td>
              <td style="text-align:center;">
                <strong style="color:#fbbf24;font-size:16px;">${item.totalScore} Pts</strong>
              </td>
              <td style="text-align:center;">
                <span style="color:#10b981;font-weight:700;"><i class="fa-solid fa-circle-check"></i> ${item.correctAnswers || 0}</span>
              </td>
              <td style="text-align:right;color:var(--text-secondary);font-size:13px;">
                ${dateStr}
              </td>
            </tr>
          `;
        }).join('');
      }

      // Event Listeners
      const catGlobalBtn = document.getElementById('cat-global-xp');
      const catGamesBtn = document.getElementById('cat-games');
      const top10Btn = document.getElementById('tab-top10');
      const allBtn = document.getElementById('tab-all');
      const searchInput = document.getElementById('leaderboard-search');
      const gameFilter = document.getElementById('game-filter-select');

      catGlobalBtn.onclick = () => {
        currentCategory = 'global-xp';
        catGlobalBtn.classList.add('active');
        catGamesBtn.classList.remove('active');
        fetchLeaderboard();
      };

      catGamesBtn.onclick = () => {
        currentCategory = 'games';
        catGamesBtn.classList.add('active');
        catGlobalBtn.classList.remove('active');
        fetchLeaderboard();
      };

      top10Btn.onclick = () => {
        currentView = 'top10';
        top10Btn.classList.add('active');
        allBtn.classList.remove('active');
        fetchLeaderboard();
      };

      allBtn.onclick = () => {
        currentView = 'all';
        allBtn.classList.add('active');
        top10Btn.classList.remove('active');
        fetchLeaderboard();
      };

      searchInput.addEventListener('input', () => {
        if (currentCategory === 'global-xp') {
          renderGlobalXPTable();
        } else {
          renderGamesTable();
        }
      });

      if (gameFilter) {
        gameFilter.onchange = () => {
          currentGameFilter = gameFilter.value;
          fetchLeaderboard();
        };
      }

      // Initial Fetch
      await fetchLeaderboard();

      // Live polling every 15 seconds
      const pollTimer = setInterval(fetchLeaderboard, 15000);
      window.addEventListener('beforeunload', () => clearInterval(pollTimer));
    });
  </script>
</body>
</html>
